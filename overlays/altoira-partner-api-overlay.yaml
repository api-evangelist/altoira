actions:
- target: $.info
  update:
    x-apievangelist-provider: altoira
    x-apievangelist-harvested: '2026-08-06'
    x-apievangelist-source: https://readme.altoira.com/reference
    x-apievangelist-harvest-method: >-
      Extracted verbatim from the ssr-props payload of the ReadMe developer hub.
      Alto serves no /openapi.json, /swagger.json or spec download link on any
