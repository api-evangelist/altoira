envelope:
  description: >-
    Alto does NOT use RFC 9457 problem+json. Two response shapes appear in the
    OpenAPI. Money-movement operations (distribution) return an explicit
    {"error": true, "message": "..."} JSON object. The shared Unauthorized
    response returns {"message": "..."}. The remaining 4xx responses are declared
    with a description and status code only — no schema and no content type — so
    the body shape for those is undocumented.
  fields:
  - name: error
    type: boolean
    description: Present on distribution failures; always true.
  - name: message
    type: string
    description: Human-readable failure reason. Not a stable machine-readable code.
  content_type: application/json
  machine_readable_code: false
  note: >-
    There is no error `code` or `type` field anywhere in the contract. Clients
    must branch on HTTP status, and — for distribution — on the free-text
    `message` string. This is the single biggest agent-readiness gap in the
    contract.
