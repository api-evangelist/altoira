apis:
- name: AltoIRA.com API
  description: 'Alto''s partner REST API for investment platforms and issuers. Covers
    the OAuth handoff that connects an investor''s Alto IRA to a partner platform,
    offering creation and updates, offering document upload (individually or as a zip),
    enabling an investor for an offering, retrieving investment detail, and the
    post-commitment money movement operations — refund, cancel, distribution and new
    capital call. Authentication is split three ways: HTTP Basic (PlatformAuth) for
    manager-context offering and investment operations, OAuth 2.0 authorization code
    (UserOauth) to obtain investor consent, and the resulting bearer token (UserAuth)
    for user-context operations. Investment lifecycle is tracked out-of-band with
    webhooks.'
