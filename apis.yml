aid: altoira
name: AltoIRA
description: 'Alto (AltoIRA) is a Nashville-based self-directed IRA platform that lets
  everyday investors hold alternative assets — private equity, venture funds, startups,
  real estate, farmland, private credit and cryptocurrency — inside tax-advantaged
  Traditional, Roth and SEP retirement accounts. Alto Trust Company acts as the IRA
  custodian and Alto Securities, LLC (FINRA/SIPC) operates the Alto Marketplace of
  curated private-market offerings. Alto reports custody of roughly $2B in assets for
  about 30,000 self-directed IRA investors and support for more than 2,500 issuers who
  have raised capital on the platform. For issuers and investment platforms, Alto
  publishes a partner REST API (the "AltoIRA.com API") on a ReadMe developer hub that
  covers OAuth investor handoff, offering creation, document upload, investor
  invitation, investment retrieval, refunds, cancellations, distributions and capital
  calls, plus an investment-status webhook feed.'
