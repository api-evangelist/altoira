generated: '2026-08-06'
method: searched
source: live probes of every AltoIRA host found in apis.yml and the OpenAPI servers[]
notes: >-
  Alto runs an Auth0 tenant at auth.altoira.com for the investor/issuer web app
  (app.altoira.com redirects there for universal login). That tenant publishes a
  complete OIDC discovery document, an RFC 8414 authorization-server metadata
  document (byte-identical to the OIDC one) and a JWKS. This is a SEPARATE
  authorization server from the partner API's own OAuth 2.0 endpoints, which the
  OpenAPI declares at altoira.sandbox.altoira.com/oauth/{authorize,token} — do not
  conflate the two. No /.well-known/security.txt, api-catalog, ai-plugin.json,
  agent-card.json or agent.json was served by any Alto host.
